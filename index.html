<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #243b55;
        }

        .box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #243b55;
            color: white;
            border: none;
            cursor: pointer;
        }

        #error { color: red; }

        #hacked {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        #moving {
            position: absolute;
            color: lime;
            font-size: 40px;
            font-family: monospace;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="box" id="loginBox">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username or email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error"></p>
    </div>

    <div id="hacked">
        <div id="moving">YOU ARE HACKED</div>
    </div>

    <script>
        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (username == "" || password == "") {
                document.getElementById("error").innerText = "Please fill both boxes.";
                return;
            }

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("hacked").style.display = "block";

            moveText();
        }

        function moveText() {
            var text = document.getElementById("moving");
            var x = 50;
            var y = 50;
            var speedX = 3;
            var speedY = 3;

            setInterval(function () {
                x = x + speedX;
                y = y + speedY;

                if (x + text.offsetWidth > window.innerWidth || x < 0) {
                    speedX = -speedX;
                }

                if (y + text.offsetHeight > window.innerHeight || y < 0) {
                    speedY = -speedY;
                }

                text.style.left = x + "px";
                text.style.top = y + "px";
            }, 20);
        }
    </script>

</body>
</html>
