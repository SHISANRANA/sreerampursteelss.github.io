<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Sreerampur Steelss</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --mill: #151c25;
            --steel: #5b6b7a;
            --sheet: #eef1f3;
            --line: #d3d9de;
            --amber: #d9791f;
            --amber-dark: #b8620f;
            --error: #b3261e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Barlow", Arial, sans-serif;
            color: var(--mill);
            background: var(--sheet);
        }

        .hidden { display: none !important; }

        .layout {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            min-height: 100vh;
        }

        /* ---------- Brand side ---------- */
        .brand {
            background:
                repeating-linear-gradient(90deg, #ffffff08 0 2px, transparent 2px 46px),
                var(--mill);
            color: #fff;
            padding: 48px 56px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo {
            font-family: "Barlow Condensed", Arial, sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--amber);
            clip-path: polygon(0 0, 100% 0, 100% 30%, 35% 30%, 35% 42%, 100% 42%, 100% 100%, 0 100%, 0 70%, 65% 70%, 65% 58%, 0 58%);
        }

        .brand h2 {
            font-family: "Barlow Condensed", Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(40px, 5vw, 68px);
            line-height: 1;
            margin: 0 0 18px;
            max-width: 12ch;
        }

        .brand p {
            color: #b9c3cc;
            font-size: 17px;
            line-height: 1.5;
            max-width: 38ch;
            margin: 0;
        }

        .brand small { color: #8593a0; font-size: 13px; }

        /* ---------- Form side ---------- */
        .panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }

        .card { width: 100%; max-width: 400px; }

        .card h1 {
            font-family: "Barlow Condensed", Arial, sans-serif;
            font-size: 38px;
            margin: 0 0 6px;
        }

        .sub { color: var(--steel); margin: 0 0 28px; }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin: 18px 0 6px;
        }

        .field { position: relative; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            font: inherit;
            border: 1.5px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--mill);
        }

        input:focus { border-color: var(--amber); outline: none; box-shadow: 0 0 0 4px #d9791f26; }
        input.invalid { border-color: var(--error); }

        .toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--steel);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 10px;
            cursor: pointer;
        }

        .msg {
            color: var(--error);
            font-size: 13px;
            margin: 6px 0 0;
            min-height: 18px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0 22px;
            font-size: 14px;
        }

        .row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            margin: 0;
        }

        a { color: var(--amber-dark); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }

        .primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: var(--amber);
            color: #fff;
            font: inherit;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .primary:hover { background: var(--amber-dark); }
        .primary:disabled { opacity: 0.75; cursor: wait; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2.5px solid #ffffff66;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            background: #fdecea;
            border-left: 4px solid var(--error);
            color: var(--error);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .help { margin-top: 28px; font-size: 14px; color: var(--steel); }
